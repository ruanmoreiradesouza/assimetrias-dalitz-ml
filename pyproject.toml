[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dalitzcp"
version = "0.1.0"
description = "Assimetrias de CP no plano de Dalitz de B± → K±π+π−: ajuste de amplitudes, método de Miranda e classificadores"
readme = "README.md"
requires-python = ">=3.12"
# versões fixas para reprodutibilidade (mesmas do ambiente em que os testes passaram)
dependencies = [
    "numpy==2.1.3",
    "scipy==1.15.2",
    "iminuit==2.33.0",
    "scikit-learn==1.9.1",
    "matplotlib==3.10.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.14.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# nomes de variáveis físicas (Γ, Δφ escritos como G, dphi) e letras maiúsculas em fórmulas são intencionais
ignore = ["E741", "N"]
